services:
  # Paper trading bot - BTC Long
  paper-btc-long:
    build: .
    container_name: hibachi-paper-btc-long
    restart: unless-stopped
    volumes:
      - ./data/btc-long:/data
    environment:
      - HIBACHI_SYMBOL=BTC/USDT-P
      - BOT_MODE=long
      - PAPER_BALANCE=10000
      - POSITION_SIZE_USD=100
      - LEVERAGE=2
      - TAKE_PROFIT=2.0
      - STOP_LOSS=-1.0
      - LOOP_SLEEP=3
      - CYCLE_COOLDOWN=10
      - LOG_LEVEL=INFO

