services:
  # Paper trading bot - BTC Long
  paper-btc-long:
    build: .
    container_name: hibachi-paper-btc-long
    restart: unless-stopped
    volumes:
      - ./data/btc-long:/data
    environment:
      - HIBACHI_SYMBOL=BTC/USDT-P
      - BOT_MODE=long
      - PAPER_BALANCE=10000
      - POSITION_SIZE_USD=100
      - LEVERAGE=2
      - TAKE_PROFIT=2.0
      - STOP_LOSS=-1.0
      - LOOP_SLEEP=3
      - CYCLE_COOLDOWN=10
      - LOG_LEVEL=INFO

  # Market Making bot - BTC
  mm-btc:
    build: .
    container_name: hibachi-mm-btc
    restart: unless-stopped
    command: ["python", "-u", "mm_bot.py"]
    volumes:
      - ./data/mm-btc:/data
    environment:
      - HIBACHI_SYMBOL=BTC/USDT-P
      - PAPER_BALANCE=10000
      - MM_SPREAD_BPS=10
      - MM_ORDER_SIZE_USD=50
      - MM_LEVELS=2
      - MM_LEVEL_SPACING_BPS=5
      - MM_MAX_INVENTORY_USD=120
      - MM_SKEW_BPS_PER_PCT=0.8
      - MM_REQUOTE_INTERVAL=4
      - MM_STALE_THRESHOLD_BPS=12
      - LEVERAGE=1
      - LOG_LEVEL=INFO
      # Realistic fill simulation
      - FILL_MIN_REST_SECS=3
      - FILL_THROUGH_BPS=1

